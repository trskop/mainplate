name: mainplate
version: !include ./version.yaml
synopsis: Common patterns used for application main.
description: Common patterns used for application @main@.
maintainer: Peter Trško <peter.trsko@gmail.com>
copyright: (c) 2017-2026 Peter Trško
license: BSD3
license-file: LICENSE
github: trskop/mainplate
category: System, Options, CLI

extra-source-files:
  - ChangeLog.md
  - README.md
  - dhall/**/*.dhall

ghc-options:
  - "-Wall"
  - "-Wcompat" # GHC ≥8.0
  - "-Wimplicit-prelude" # GHC ≥6.8
  - "-Wmissing-deriving-strategies" # GHC ≥8.8
  - "-Wmissing-export-lists" # GHC ≥8.4
  - "-Wmissing-import-lists" # GHC ≥7.0
  - "-Wprepositive-qualified-module" # GHC ≥8.10

default-extensions:
  - BlockArguments # GHC ≥8.6
  - DeriveAnyClass # GHC ≥7.10
  - DeriveFunctor # GHC ≥7.10
  - DeriveGeneric # GHC ≥7.2
  - DerivingStrategies # GHC ≥8.2
  - DuplicateRecordFields # GHC ≥8.0
  - ExplicitNamespaces # GHC ≥7.6
  - FlexibleContexts # GHC ≥6.8
  - FlexibleInstances # GHC ≥6.8
  - GeneralizedNewtypeDeriving # GHC ≥6.8
  - ImportQualifiedPost # GHC ≥8.10
  - InstanceSigs # GHC ≥7.6
  - LambdaCase # GHC ≥7.6
  - MultiParamTypeClasses # GHC ≥6.8
  - NamedFieldPuns # GHC ≥6.10
  - NoImplicitPrelude # GHC ≥6.8
  - OverloadedStrings # GHC ≥6.8
  - PatternSynonyms # GHC ≥7.8
  - RankNTypes # GHC ≥6.8
  - RecordWildCards # GHC ≥6.8
  - ScopedTypeVariables # GHC ≥6.8
  - TypeApplications # GHC ≥8.0
  - TypeFamilies # GHC ≥6.8
  - TypeOperators # GHC ≥6.8

flags:
  pedantic:
    description: |
      Turn on additional warning flags
    manual: true
    default: false

when:
  - condition: flag(pedantic)
    ghc-options:
      - "-Werror" # GHC ≥6.8

dependencies:
  - base >=4.9 && <5
  # ^ Version 4.9.0.0 is bundled with GHC 8.0.

  # Packages from Stackage+Hackage:
  - aeson
  - case-insensitive
  - dhall >= 1.33.0
  # ^ Inject/Interpret were renamed to ToDhall/FromDhall in version 1.27.0
  # (standard 11.0.0), we can't go below that now as we use the new names.
  #
  # Bultins `Optional/{fold,build}` were removed in version 1.33.0 (standard
  # 17.0.0), while this should not affect the code here, it does make binary
  # serialisation incompatible when it comes to more complicated use cases. To
  # prevent major issues we need to depend on at least this version.
  #
  # Version 1.36.0 added `Text/replace` and made `with` a first class citizen.
  # While we may want to depend on these features in the future, if we limit
  # our selves to standard 17.0.0 we should still be compatible, unlike in the
  # case of removed `Optional/{fold,build}`.
  - filepath
  - mtl
  - network
  - optparse-applicative
  - process
  - semver
  - terminfo
  - text
  - unordered-containers
  - verbosity
  - yaml

  # Other packages:
  - host-and-port >=0.0.1.0 && <1

library:
  source-dirs: src

